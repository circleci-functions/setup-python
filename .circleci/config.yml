version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  python-version:
    type: string
    default: "3.13.15"
    description: >-
      Python version for the acceptance and smoke tests to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  base:
    docker:
      - image: cimg/base:stable
  alpine:
    docker:
      - image: alpine:3
  arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-python-go-{{ checksum "go.sum" }}-
            - setup-python-go-
      - run: task lint
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-python-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Real Python downloads, real package-manager installs and a real task-agent
  # cache (TOOLKIT_CACHE_MODE=live). Runs on the go executor because the suite
  # compiles setup-python in TestMain; the package managers are installed here
  # so the install matrix runs for real.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-python-go-{{ checksum "go.sum" }}-
            - setup-python-go-
      - run:
          name: Install Python and package managers
          # --no-user and the scripts dir on PATH, because the tests run with a
          # temp $HOME that user installs would not be visible from.
          command: |
            go run . --python-version << pipeline.parameters.python-version >>
            python -m pip install --no-user --disable-pip-version-check pipenv poetry uv setuptools wheel
            echo "export PATH=\"$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):\$PATH\"" >> "$BASH_ENV"
      - run:
          name: Run acceptance tests
          command: task acceptance -- -skip '^TestAcceptance_InstallsOntoTheRealPath$'
          environment:
            # Use the job's own cache rather than the in-memory stand-in, so the
            # round-trips exercise the real thing. The suite fails rather than
            # falling back if it can't reach it.
            TOOLKIT_CACHE_MODE: live
      - store_test_results:
          path: test-results

  # Cross-compiles setup-python into ./dist and persists it to the workspace, so
  # the smoke jobs exercise exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-python-go-{{ checksum "go.sum" }}-
            - setup-python-go-
      - run: task dry-run
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  smoke:
    description: >-
      Let setup-python pick where python goes on this executor's real PATH,
      then resolve python, pip and what pip installed by name in processes that
      sourced nothing.

      Everything runs from the workspace, so the executor needs no Go, no
      modules and no checkout: the suite is a cross-compiled test binary, and
      test2json and gotestsum turn its output into the JUnit CircleCI collects.
    parameters:
      e:
        type: executor
        description: The executor to smoke test on.
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    executor: << parameters.e >>
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Python onto PATH and resolve it afterwards
          command: |
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run TestAcceptance_InstallsOntoTheRealPath
          environment:
            SETUP_PYTHON_BINARY: ./dist/setup-python/<< parameters.platform >>/setup-python<< parameters.ext >>
            SETUP_PYTHON_ACCEPTANCE_VERSION: << pipeline.parameters.python-version >>
      - store_test_results:
          path: test-results

  # Keeps the release PR up to date (see RELEASE.md).
  release-pr:
    executor: go
    steps:
      - checkout
      # github-release's token, which can also read private modules.
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-python-go-{{ checksum "go.sum" }}-
            - setup-python-go-
      - run:
          name: Open, update or close the release PR
          command: go tool release-pr update

  # Publishes only on the push that merges the release PR; halts otherwise.
  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-python-go-{{ checksum "go.sum" }}-
            - setup-python-go-
      - run:
          name: Halt unless the release is unpublished
          command: |
            VERSION="$(go tool release-pr pending)"
            if [ -z "$VERSION" ]; then
              circleci-agent step halt
              exit 0
            fi
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Make the GitHub release and tag
          command: go tool release-pr tag
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
      - acceptance:
          context: [github-readonly]
      - build:
          context: [github-readonly]
      - smoke:
          name: smoke-linux-amd64
          e: base
          platform: linux/amd64
          requires: [build]
      - smoke:
          name: smoke-linux-arm64
          e: arm64
          platform: linux/arm64
          requires: [build]
      - smoke:
          name: smoke-alpine
          e: alpine
          platform: linux/amd64
          requires: [build]
      - smoke:
          name: smoke-macos
          e: macos
          platform: darwin/arm64
          requires: [build]
      - smoke:
          name: smoke-windows
          e: windows
          platform: windows/amd64
          ext: ".exe"
          requires: [build]
      - release-pr:
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - smoke-linux-amd64
            - smoke-linux-arm64
            - smoke-alpine
            - smoke-macos
            - smoke-windows
          context: [github-release]
          filters:
            branches:
              only: main
      - publish:
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
